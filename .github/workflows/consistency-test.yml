name: generate consistency

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  consistency-test:
    name: "Consistency Test"
    runs-on: ubuntu-latest

    steps:
      - name: "Fetch source code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Debug
        shell: bash
        run: |
          rbenv install 3.2.3
          ruby --version

      - name: Debug 2
        shell: bash
        run: |
          apt install ragel
          ragel --version

      # - name: Download Ruby
      #   shell: bash
      #   run: . # TODO

      # - name: Download Ragel
      #   shell: bash
      #   run: . # TODO

      - name: Go Generate
        shell: bash
        run: |
          go generate ./...
          git status

